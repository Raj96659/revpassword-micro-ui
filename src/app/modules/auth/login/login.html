<div class="login-page">

  <div class="login-card">

    <h2>🔐 Login</h2>

    <input
      type="text"
      placeholder="Email"
      [(ngModel)]="email"
    >

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
    >

    <button (click)="login()">Login</button>

    <p class="register-link">
      Don't have an account?
      <a routerLink="/register">Register</a>
    </p>

  </div>

</div>
