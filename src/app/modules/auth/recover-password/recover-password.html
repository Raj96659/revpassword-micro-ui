<div class="login-page">

  <div class="login-card">

    <h2>🔑 Recover Password</h2>

    <!-- Email -->
    <input
      type="email"
      placeholder="Enter your email"
      [(ngModel)]="email"
    >

    <button (click)="loadQuestions()">Load Security Questions</button>

    <!-- Show questions after loading -->

    <div *ngIf="questionsLoaded">

      <p>{{ question1 }}</p>
      <input
        type="text"
        placeholder="Your answer"
        [(ngModel)]="answer1"
      >

      <p>{{ question2 }}</p>
      <input
        type="text"
        placeholder="Your answer"
        [(ngModel)]="answer2"
      >

      <p>{{ question3 }}</p>
      <input
        type="text"
        placeholder="Your answer"
        [(ngModel)]="answer3"
      >

      <input
        type="password"
        placeholder="New Password"
        [(ngModel)]="newPassword"
      >

      <button (click)="recover()">Reset Password</button>

    </div>

    <p class="message">{{message}}</p>

    <p class="register-link">
      <a routerLink="/login">Back to Login</a>
    </p>

  </div>

</div>
